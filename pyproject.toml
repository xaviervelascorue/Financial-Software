[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsoft"
version = "0.1.0"
description = "Contabilidad multientidad (autónomos, comunidades de bienes y sociedades holding) con reporting fiscal español"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "anthropic>=2.8",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finsoft = "finsoft.cli:main"

[tool.setuptools.packages.find]
include = ["finsoft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
